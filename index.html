
<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funding Rates 排序</title>
    <link href="https://cdn.jsdelivr.net/npm/prismjs@1.27.0/themes/prism.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.27.0/prism.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.27.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/prismjs@1.27.0/plugins/line-numbers/prism-line-numbers.css"
        rel="stylesheet" />
    <style>
        body {
            display: flex;
            margin: 20px;
            height: 100vh;
        }

        #funding-rates-container {
            flex: 1;
            overflow: auto;
        }

        .danger {
            color: red;
            font-weight: bold;
        }

        #funding-rates-content {
            display: none;
            position: relative;
            background-color: #f4f4f4;
            padding: 20px;
            border: 1px solid #ddd;
            width: 50%;
            height: 100vh;
            overflow-y: auto;
            border-radius: 5px;
        }

        pre {
            margin: 0;
            padding: 10px;
            overflow: auto;
            height: 100%;
        }

        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .copy-btn:hover {
            opacity: 1;
        }

        .copy-btn::after {
            content: '📋 Copy';
            font-size: 14px;
            color: #333;
        }

        .copy-btn.copied::after {
            content: '✔ Copied';
            color: green;
        }
    </style>
</head>

<body>
    <div id="funding-rates-container">
        <h1>Funding Rates 排序</h1>
        <button onclick="toggleFundingRates()">顯示/隱藏 CryptoTrading.js 內容</button>
        <p id="progress">已處理 0 / 0 筆</p>
        <ul id="funding-rates"></ul>
    </div>

    <div id="funding-rates-content">
        <!-- 上/下頁按鈕 -->
        <button class="page-btn" id="prev-btn" onclick="changeScript(-1)">⬅ 上一頁</button>
        <button class="page-btn" id="next-btn" onclick="changeScript(1)">下一頁 ➡</button>

        <!-- 複製按鈕 -->
        <button class="copy-btn" onclick="copyContent()"></button>

        <pre class="line-numbers"><code class="language-javascript"></code></pre>
    </div>

    <script>
        const proxyUrl = 'https://crimson-brook-7b64.siriuschurchill.workers.dev/api';
        const apiUrlTradingPairs = '/trading_pairs';
        const apiUrlFundingRate = '/funding_rate?symbol=';
        const dangerSymbols = ["HIVEUSDT", "MEUSDT", "GLMUSDT"];

        const tradingPairsMap = {}; // 存交易對資訊

        async function fetchTradingPairs() {
            try {
                const response = await fetch(proxyUrl + apiUrlTradingPairs);
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                const data = await response.json();

                data.data.forEach(pair => {
                    tradingPairsMap[pair.symbol] = {
                        maxMarketOrderVolume: parseFloat(pair.maxMarketOrderVolume),
                        maxLimitOrderVolume: parseFloat(pair.maxLimitOrderVolume),
                        minTradeVolume: parseFloat(pair.minTradeVolume)
                    };
                });

                return Object.keys(tradingPairsMap); // 回傳所有 symbol 陣列
            } catch (error) {
                alert("請求失敗，請檢查 Cloudflare Workers 是否正常運作！");
                console.error(error);
                return [];
            }
        }

        async function displayFundingRates() {
            const symbols = await fetchTradingPairs();
            if (symbols.length === 0) return;

            const rates = [];
            const progress = { completed: 0, total: symbols.length };

            updateDisplay(rates, progress);

            for (const symbol of symbols) {
                fetchFundingRate(symbol, rates, progress);
            }
        }

        async function fetchFundingRate(symbol, rates, progress) {
            try {
                const response = await fetch(proxyUrl + apiUrlFundingRate + symbol);
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                const data = await response.json();

                const fundingRate = parseFloat(data.data.fundingRate);
                const price = parseFloat(data.data.markPrice) || 1; // 修正為 markPrice

                // 交易量資訊來自 tradingPairsMap
                const pairInfo = tradingPairsMap[symbol] || {};

                rates.push({
                    symbol,
                    fundingRate,
                    price, // 存市場價格
                    maxMarketOrderVolume: pairInfo.maxMarketOrderVolume || 0,
                    maxLimitOrderVolume: pairInfo.maxLimitOrderVolume || 0,
                    minTradeVolume: pairInfo.minTradeVolume || 0,
                });

                progress.completed++;
                updateDisplay(rates, progress);
            } catch (error) {
                console.error("請求錯誤:", error);
            }
        }

        function updateDisplay(rates, progress) {
            const progressContainer = document.getElementById('progress');
            const container = document.getElementById('funding-rates');

            progressContainer.textContent = `已處理 ${progress.completed} / ${progress.total} 筆`;

            container.innerHTML = rates
                .sort((a, b) => a.fundingRate - b.fundingRate)
                .map(rate => {
                    const isDanger = dangerSymbols.includes(rate.symbol);
                    const price = rate.price || 1; // 確保 price 不為 0

                    const marketOrderUSD = (rate.maxMarketOrderVolume * price).toFixed(2);
                    const limitOrderUSD = (rate.maxLimitOrderVolume * price).toFixed(2);
                    const minTradeUSD = (rate.minTradeVolume * price).toFixed(2);

                    return `
                         <li class="${isDanger ? 'danger' : ''}">
                            <strong>${rate.symbol}</strong>: ${rate.fundingRate}<br>
                            當前價格 (Mark Price): $${price.toFixed(6)} USD<br>
                            最大市價單交易量: ${rate.maxMarketOrderVolume.toLocaleString()}<br>
                            最大限價單交易量: ${rate.maxLimitOrderVolume.toLocaleString()}<br>
                            最小交易量: ${rate.minTradeVolume.toLocaleString()}
                        </li>
                    `;
                    // return `
                    //      <li class="${isDanger ? 'danger' : ''}">
                    //         <strong>${rate.symbol}</strong>: ${rate.fundingRate}<br>
                    //         當前價格 (Mark Price): $${price.toFixed(6)} USD<br>
                    //         最大市價單交易量: ${rate.maxMarketOrderVolume.toLocaleString()} (${marketOrderUSD.toLocaleString()} USD)<br>
                    //         最大限價單交易量: ${rate.maxLimitOrderVolume.toLocaleString()} (${limitOrderUSD.toLocaleString()} USD)<br>
                    //         最小交易量: ${rate.minTradeVolume.toLocaleString()} (${minTradeUSD.toLocaleString()} USD)
                    //     </li>
                    // `;
                })
                .join('');
        }

        async function toggleFundingRates() {
            const contentBlock = document.getElementById('funding-rates-content');
            if (contentBlock.style.display === 'block') {
                contentBlock.style.display = 'none';
                return;
            }

            await loadScript(jsFiles[currentIndex]);
            contentBlock.style.display = 'block';
            Prism.highlightAll();
        }

        // 記錄 JS 檔案清單
        let jsFiles = [];  // 以後可以動態增加更多的檔案
        let currentIndex = 0; // 目前顯示的 JS 檔案索引

        // 讀取 JavaScript/jsFiles.txt 並獲取 JS 檔案清單
        async function fetchJsFiles() {
            try {
                const response = await fetch('JavaScript/jsFiles.txt'); // 更新為正確路徑
                if (!response.ok) throw new Error('無法獲取檔案清單');
                const text = await response.text();
                jsFiles = text.split('\n').map(line => line.trim()).filter(line => line); // 解析清單

                if (jsFiles.length > 0) {
                    loadScript(jsFiles[currentIndex]); // 預設載入第一個檔案
                }
            } catch (error) {
                console.error('無法加載 JS 檔案清單:', error);
            }
        }

        async function loadScript(scriptName) {
            try {
                const response = await fetch(`JavaScript/${scriptName}`);
                if (!response.ok) throw new Error(`無法載入 ${scriptName}: ${response.status}`);
                const jsCode = await response.text();
                document.querySelector('#funding-rates-content code').textContent = jsCode;

                // 重新初始化行號
                const preBlock = document.querySelector('pre');
                preBlock.classList.add('line-numbers');
                Prism.highlightAll(); // 確保重新高亮代碼
            } catch (error) {
                console.error(`載入 ${scriptName} 錯誤:`, error);
            }
        }

        function copyContent() {
            const codeText = document.querySelector('#funding-rates-content code').innerText;
            navigator.clipboard.writeText(codeText).then(() => {
                const copyBtn = document.querySelector('.copy-btn');
                copyBtn.classList.add('copied');
                setTimeout(() => copyBtn.classList.remove('copied'), 1500);
            }).catch(err => console.error('複製失敗:', err));
        }

        function changeScript(direction) {
            currentIndex = (currentIndex + direction + jsFiles.length) % jsFiles.length;
            loadScript(jsFiles[currentIndex]);
        }

        document.addEventListener('DOMContentLoaded', function () {
            displayFundingRates();  // 保留這個函數，處理資金利率顯示邏輯
            fetchJsFiles();         // 加載 JavaScript 檔案清單
        });

    </script>
</body>

</html>
